; Bind the Unreal MCP listener to localhost. Port 8123 is used because the Windows
; "IP Helper" (iphlpsvc) service already listens on 0.0.0.0:8000, which prevents the
; editor from binding port 8000 at all. Keep this in sync with ServerPortNumber in
; DefaultEditorPerProjectUserSettings.ini and with the client URLs.
; For LAN access from another machine, set BindAddress to THIS host's own LAN IP
; (machine-specific) and add a firewall rule for TCP 8123 restricted to the trusted LAN.
[HTTPServer.Listeners]
+ListenerOverrides=(Port=8123,BindAddress=127.0.0.1)

; TAPython's Python folder (<Project>/TA/TAPython/Python) is added to sys.path at
; editor startup by Content/Python/init_unreal.py, which derives it from the project
; directory so it stays correct on every machine. UE's Python "Additional Paths" only
; accepts absolute, machine-specific paths, so it is intentionally not set here.
