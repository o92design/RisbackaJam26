[ContentBrowser]
ContentBrowserTab1.SelectedPaths=/Game/ThirdPersonBP

; Auto-start the Unreal MCP server at editor launch so no manual
; "ModelContextProtocol.StartServer" console command is needed. The listener binds
; to 127.0.0.1:8123 (see [HTTPServer.Listeners] in DefaultEngine.ini). Port 8123 avoids
; the Windows "IP Helper" service, which occupies port 8000. Set bAutoStartServer=False
; to opt out.
[/Script/ModelContextProtocolEngine.ModelContextProtocolSettings]
bAutoStartServer=True
ServerPortNumber=8123