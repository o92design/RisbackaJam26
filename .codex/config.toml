# Start the server manually in Unreal Editor, then restart/reload Codex.
# The UE console command is: ModelContextProtocol.StartServer
# This is the Unreal Editor host's LAN address. Update it if DHCP changes the address.
[mcp_servers.unreal-mcp]
url = "http://192.168.1.157:8000/mcp"

[agents]
max_concurrent_threads_per_session = 3
