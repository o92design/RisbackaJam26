# Start the server manually in Unreal Editor, then restart/reload Codex.
# The UE console command is: ModelContextProtocol.StartServer
# Defaults to localhost. For a remote editor host, set RISBACKA_MCP_URL or override
# this url with the host's LAN address.
[mcp_servers.unreal-mcp]
url = "http://127.0.0.1:8123/mcp"

[agents]
max_concurrent_threads_per_session = 3
